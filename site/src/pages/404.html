<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена · PlugBackup</title>
  <meta name="description" content="Такой страницы на PlugBackup нет.">
  <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181C" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/IBMPlexSans-SemiBold-Cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/IBMPlexSans-Regular-Cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
{{header}}
<main id="main">
  <section class="hero hero--compact" aria-labelledby="nf-title">
    <div class="wrap">
      <p class="pb-label hero__eyebrow">Ошибка 404</p>
      <h1 class="pb-h1 hero__title" id="nf-title">Страница не найдена</h1>
      <p class="pb-lead hero__lead">Возможно, адрес набран с ошибкой или страница переехала. Начать можно с главной или с инструкции по подключению.</p>
      <div class="hero__actions">
        <a class="pb-button pb-button--primary" href="/">На главную</a>
        <a class="pb-link" href="/docs/">Инструкция по подключению</a>
      </div>
    </div>
  </section>
</main>
{{footer}}
<script src="/assets/js/app.js" defer></script>
</body>
</html>

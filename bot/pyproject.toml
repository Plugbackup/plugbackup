[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plugbackup-bot"
version = "0.1.0"
description = "Telegram-бот PlugBackup: оплата и выдача доступа"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22,<1",
    "pydantic-settings>=2.7,<3",
    "tzdata",
]

[project.optional-dependencies]
# Только для scripts/: Pillow готовит аватар (PNG -> JPG).
tools = [
    "pillow>=11,<13",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "pillow>=11,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plugbackup_bot = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
# RUF001-003: кириллица в строках и комментариях помечается как «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# ASYNC109: подмены сессии aiogram повторяют сигнатуру с параметром timeout.
"tests/**" = ["S101", "S105", "S106", "ASYNC109"]

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>PlugBackup: {{label}}</title>
  <rect width="1280" height="720" fill="{{color.neutral.900}}"/>
  <g transform="translate(924 150) scale(12)">{{@mark:on-dark}}</g>
  <g transform="translate(80 60) scale(1.2)">{{@lockup:on-dark}}</g>
  <rect x="1174" y="71" width="26" height="26" rx="6.5" fill="{{color.brand}}"/>
  <text x="1160" y="94" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="28" font-weight="500" fill="{{color.neutral.400}}">{{label}}</text>
  <!-- Title: up to 3 lines, about 17 characters per line. -->
  <text x="80" y="270" font-family="'IBM Plex Sans', sans-serif" font-size="84" font-weight="600" letter-spacing="-1.7" fill="{{color.neutral.100}}" data-lh="1.1" data-max="17">{{title}}</text>
  <text x="80" y="520" font-family="'IBM Plex Sans', sans-serif" font-size="34" font-weight="400" fill="{{color.neutral.400}}" data-lh="1.35" data-max="34">{{subtitle}}</text>
  <text x="80" y="664" font-family="'IBM Plex Mono', monospace" font-size="24" font-weight="400" fill="{{color.neutral.500}}">{{bot.handle}} · {{site}}</text>
</svg>
